name: Build Allied 26.3 Port Alpha 5
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --console=plain --warning-mode=all
      - name: Confirm packaged Allied source classes
        run: |
          test -f src/main/java/com/bba/allied/commands/teamCommands.java
          test -f src/main/java/com/bba/allied/commands/adminCommands.java
          ls -lh build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chillzone-allied-26.3-alpha5-jars
          path: build/libs/*.jar
